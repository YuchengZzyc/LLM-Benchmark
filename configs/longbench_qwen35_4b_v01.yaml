# =============================================================================
# 配置：longbench_qwen35_4b_v01.yaml
# Qwen3.5-4B v0.1 基线 · 长上下文维度（LongBench v1 × 12）
# =============================================================================
# 由 scripts/run_longbench.py 独立执行（不绑定 lm-eval）。
# 口径（2026-09-11 实跑）：apply_chat_template=true —— 官方 LongBench pred.py
# 对 Qwen 系走 model.chat 模板（以 evaluation.apply_chat_template 为准）。
# max_length 32768 对齐官方 LongBench 协议
# （THUDM pred.py 对 Qwen 系取模型最大窗口并截断）。
# 定位：LongBench 不作验收口径（详见 docs/evaluation_spec.md §1.1），
# 本轮为 30 样本/任务的参考评测。
# 结果写入 results/qwen35-4b-base-v0.1/result.json（与主框架合并）。
# =============================================================================

model:
  name: Qwen3.5-4B
  version: qwen35-4b-base-v0.1
  type: baseline
  path: /data/yucheng/madm-llm/models/Qwen3.5-4B
  dtype: bfloat16
  trust_remote_code: false
  revision: null
  tokenizer_path: null

evaluation:
  framework: longbench
  batch_size: 1
  apply_chat_template: true   # 官方 LongBench pred.py 对 Qwen 系走 model.chat 模板（系统提示+角色）
  max_length: 32768
  num_fewshot: null
  seed: 42
  device: cuda
  longbench_data_dir: data/longbench
  gen_kwargs:
    temperature: 0.0
    top_p: 1.0

tasks:
  long_context:
    - multifieldqa_en
    - qasper
    - hotpotqa
    - 2wikimqa
    - musique
    - gov_report
    - multi_news
    - trec
    - triviaqa
    - samsum
    - passage_count
    - passage_retrieval_en

output:
  root: results/
  registry: results/registry.yaml
  keep_samples: false
  max_samples: 30            # 每任务 30 条，全量 LongBench 官方 test 集的常规划分
