# =============================================================================
# 配置：longbench_qwen35_4b_v01.yaml
# Qwen3.5-4B v0.1 基线 · 长上下文维度（LongBench v1 × 12）
# =============================================================================
# 由 scripts/run_longbench.py 独立执行（不绑定 lm-eval）。
# 口径对齐 v0.1（冻结，见 docs/evaluation_spec.md §2.1）：apply_chat_template=true
# 走 chat 分支（系统提示 + 角色模板），模板参数 enable_thinking=False
# （不支持时降级跳过），stop_strings=["<|im_end|>"]，decode 后剥除残留
# <think>...</think> 前导。max_length 32768 对齐官方 LongBench 协议
# （THUDM pred.py 对 Qwen 系取模型最大窗口并截断）。
# 结果写入 results/qwen35-4b-base-v0.1/result.json（与主框架合并）。
# =============================================================================

model:
  name: Qwen3.5-4B
  version: qwen35-4b-base-v0.1
  type: baseline
  path: /data/yucheng/madm-llm/models/Qwen3.5-4B
  dtype: bfloat16
  trust_remote_code: false
  revision: null
  tokenizer_path: null

evaluation:
  framework: longbench
  batch_size: 1
  apply_chat_template: true   # 官方 LongBench pred.py 对 Qwen 系走 model.chat 模板（系统提示+角色）
  max_length: 32768
  num_fewshot: null
  seed: 42
  device: cuda
  longbench_data_dir: data/longbench
  gen_kwargs:
    temperature: 0.0
    top_p: 1.0

tasks:
  long_context:
    - multifieldqa_en
    - qasper
    - hotpotqa
    - 2wikimqa
    - musique
    - gov_report
    - multi_news
    - trec
    - triviaqa
    - samsum
    - passage_count
    - passage_retrieval_en

output:
  root: results/
  registry: results/registry.yaml
  keep_samples: false
  max_samples: 30            # 每任务 30 条，全量 LongBench 官方 test 集的常规划分
