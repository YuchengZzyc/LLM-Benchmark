# =============================================================================
# 配置：aa_lcr_qwen35_4b_lora_v10.yaml
# Qwen3.5-4B + LoRA v3.2 微调模型 · v1.0 · AA-LCR（微调目标任务收益验证）
# =============================================================================
# 由 scripts/aa_lcr_run.py 独立执行（不绑定 lm-eval）。
# 协议与 aa_lcr_qwen35_4b_v01.yaml（基线 v0.1，实测 59.0）逐字一致，仅
# model 段增加 adapter_path——对比即微调在目标任务上的净收益。
# 100 题全量、官方 prompt 模板、判题器 gpt-5.6-luna（OpenAI 兼容 API）。
# 单进程串行（RTX 5090 32GB，峰值显存 25.6GB，全量约 2h40m）。
# 结果写入 results/qwen35-4b-lora-v1.0/result.json（与其他维度合并）。
# 判题 API key 通过环境变量 JUDGE_API_KEY 传入（不写入任何文件）。
# =============================================================================

model:
  name: Qwen3.5-4B
  version: qwen35-4b-lora-v1.0
  type: lora
  path: /data/yucheng/madm-llm/models/Qwen3.5-4B
  adapter_path: /data/yucheng/madm-llm/madm-llm/output/qwen35_4b_lora_v3.2-peft   # 键名修正版（原目录键主干含 language_model.，PEFT 直挂会静默失效）
  dtype: bfloat16
  trust_remote_code: false
  revision: null
  tokenizer_path: null

evaluation:
  framework: aa_lcr
  batch_size: 1
  apply_chat_template: true
  max_length: 262144         # 模型原生窗口，全量上下文不截断
  num_fewshot: null
  seed: 42
  device: cuda
  # AA-LCR 数据（服务器已就位）
  aa_lcr_csv_path: /data/yucheng/AA-LCR_Dataset.csv
  aa_lcr_docs_dir: /data/yucheng/aa_lcr_data/lcr
  # 判题器（官方协议固定）
  judge_api_url: http://192.168.13.165:8002
  judge_model: gpt-5.6-luna
  gen_kwargs:
    temperature: 0.0
    top_p: 1.0
    max_new_tokens: 4096     # 官方条件无截断限制（Run#2 教训）
    enable_thinking: true    # 与基线 v0.1 同口径（官方 57.0 为带思考输出）

tasks:
  long_context:
    - aa_lcr

output:
  root: results/
  registry: results/registry.yaml
  keep_samples: true
  max_samples: 100
